<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Übungstimer">
    <title>Übungstimer · Physiotherapie</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">+</div>
        <div>
          <p class="eyebrow">PHYSIOTHERAPIE</p>
          <h1>Übungstimer</h1>
        </div>
      </header>

      <section class="timer-card" aria-label="Übungstimer">
        <p id="phase-label" class="phase-label" aria-live="polite">BEREIT</p>
        <p id="countdown" class="countdown" role="timer" aria-label="Verbleibende Zeit">00:05.0</p>
        <p id="rep-counter" class="rep-counter">Wiederholung 1 von 10</p>
        <div
          id="progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="Fortschritt"
          aria-valuemin="0"
          aria-valuemax="10"
          aria-valuenow="0"
        >
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </section>

      <section class="settings" aria-labelledby="settings-title">
        <h2 id="settings-title">Einstellungen</h2>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-name">Wiederholungen</span>
            <span class="setting-hint">Anzahl der Durchgänge</span>
          </span>
          <span class="input-with-unit">
            <input id="repetitions" type="number" inputmode="numeric" min="1" max="999" step="1" value="10">
            <span>×</span>
          </span>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-name">Zeit pro Wiederholung</span>
            <span class="setting-hint">Dauer der Übung</span>
          </span>
          <span class="input-with-unit">
            <input id="work-duration" type="number" inputmode="decimal" min="0.1" step="0.1" value="5">
            <span>Sek.</span>
          </span>
        </label>
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-name">Pause dazwischen</span>
            <span class="setting-hint">Nach jeder Wiederholung</span>
          </span>
          <span class="input-with-unit">
            <input id="rest-duration" type="number" inputmode="decimal" min="0" step="0.1" value="2">
            <span>Sek.</span>
          </span>
        </label>
      </section>

      <div class="controls">
        <button id="play-pause" class="button button-primary" type="button">
          <span id="play-pause-icon" aria-hidden="true">▶</span>
          <span id="play-pause-text">Start</span>
        </button>
        <button id="stop" class="button button-secondary" type="button" aria-label="Timer stoppen und zurücksetzen">
          <span aria-hidden="true">■</span>
          <span>Stopp</span>
        </button>
      </div>
      <p id="connection-status" class="connection-status" role="status">Offline-Nutzung wird vorbereitet …</p>
    </main>
  </body>
</html>
